name: Copia apk con nome fisso (una volta)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p 'ViViApp-*.apk'
          cp ViViApp-*.apk ViViApp.apk
          gh release upload "$TAG" ViViApp.apk --repo "$GITHUB_REPOSITORY" --clobber
